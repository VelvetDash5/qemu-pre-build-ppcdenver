name: Build QEMU Screamer (PPC Audio)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main ]

jobs:
  build-screamer:
    strategy:
      matrix:
        include:
          # Linux Build (Ubuntu)
          - os: ubuntu-22.04
            target_os: linux
            artifact_name: qemu-system-ppc-screamer-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Step 1: Install Dependencies ---
      - name: Install Linux Dependencies
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-pip ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev libsdl2-dev libpulse-dev \
            flex bison libslirp-dev libcap-ng-dev libattr1-dev wget ninja-build ccache


      # --- Step 2: Clone Screamer Fork ---
      - name: Clone QEMU Screamer Repository
        run: |
          git clone --depth 1 https://github.com/cat7/qemu

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # Configure ccache options and display initial status
      - name: Zero ccache statistics
        run: |
          ccache -M 2G # Sets maximum cache size to 2 GB
          ccache -z    # Zeroes stats to track hit rate for this run

      # --- Step 3: Configure Build ---
      - name: Configure QEMU (Linux)
        if: matrix.target_os == 'linux'
        run: |
          cd qemu
          mkdir -p build
          cd build
          ../configure \
            --cc="ccache gcc"
            --cxx="ccache g++"
            --target-list=ppc-softmmu \
            --audio-drv-list=pa,sdl \
            --enable-sdl \
            --disable-werror \
            --enable-virtfs \
            --enable-plugins

      - name: Compile Governor Plugin
        run: |
          cd qemu
          cd build
          ninja contrib/plugins/libgovernor.so
            
      # --- Step 4: Compile ---
      - name: Compile QEMU
        run: |
          cd qemu
          cd build
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      # --- Step 5: Package Executable ---
      - name: Package Binary Artifact
        run: |
          mkdir build-out
          cp qemu/build/qemu-system-ppc build-out/
          # Include BIOS files required by QEMU to boot Mac OS 9
          cp -r qemu/pc-bios build-out/
          cp -r qemu/build/contrib/plugins build_out/

      # --- Step 6: Upload Artifact ---
      - name: Upload QEMU Screamer Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build-out/
          
